version: 2
updates:
  - package-ecosystem: npm # covers pnpm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the runtime: Vercel and CI run Node 24. Bump this
      # by hand when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
