name: Staging database

# Vercel previews read the staging project, so a PR that adds a migration
# needs it applied there before its preview works. An abandoned PR can leave a
# migration behind on staging; that is acceptable for a test database.
on:
  pull_request:
    branches: [main]
    paths: [supabase/migrations/**]

concurrency:
  group: staging-db
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  push:
    name: Push migrations to staging
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      STAGING_REF: wyxeerwocbnqmjjzpgun
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same rule as CI and the pipeline: nothing destructive reaches staging either.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/migration-guard-cli.ts "origin/${{ github.base_ref }}"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0 # keep in step with the local CLI; generated types depend on it
      - run: supabase link --project-ref "$STAGING_REF"
      - run: supabase db push
