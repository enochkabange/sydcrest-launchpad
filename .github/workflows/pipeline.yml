name: Pipeline

# The only path to production. GitHub branch protection is not available on
# this private repo's plan, so this workflow is the gate:
#   1. gate        only commits that arrived through a merged PR may deploy
#   2. verify      lint, types, unit tests, audit, build, migration safety
#   3. test-db     every migration from scratch, db lint, pgTAP, types in sync
#   4. e2e         Playwright against the local stack
#   5. deploy-db   migrations to production
#   6. deploy-frontend  Vercel, then version check, smoke test, auto rollback
# Any failure stops the run and leaves production as it was.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false # queue, never kill a half finished deploy

permissions:
  contents: read
  packages: read

env:
  PROD_REF: vgdnuztoemexrtooofme
  PROD_URL: https://sydcrest-launchpad.vercel.app
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  gate:
    name: Merged PR only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Refuse commits that did not come from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .number] | join(",")')
          if [ -n "$prs" ]; then
            echo "Commit $GITHUB_SHA comes from merged PR(s): #$prs"
            exit 0
          fi
          echo "::error::$GITHUB_SHA was pushed to main without a merged PR. Not deploying."
          gh issue create -R "$GITHUB_REPOSITORY" --label bug \
            --title "Direct push to main blocked from deploying ($GITHUB_SHA)" \
            --body "Commit $GITHUB_SHA by @$GITHUB_ACTOR reached main without a merged pull request, so the pipeline refused to deploy it. Open a PR for the change (or revert it). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          exit 1

  verify:
    name: Verify
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (high and critical, production deps)
        run: pnpm audit --prod --audit-level high
      - name: Migration guard (shipped migrations untouched, new ones expand only)
        run: pnpm tsx scripts/migration-guard-cli.ts "${{ github.event.before }}"
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  test-db:
    name: Database tests
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0 # keep in step with the local CLI; generated types depend on it
      - name: Cache Supabase images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-image-cache
          key: supabase-images-v2-db-${{ hashFiles('supabase/config.toml') }}
      - run: scripts/ci/supabase-start.sh -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: supabase db reset
      - run: supabase db lint --level error
      - run: supabase test db
      - name: Generated types match the migrations
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/generated.ts
          diff <(grep -v PostgrestVersion src/lib/supabase/database.types.ts) \
               <(grep -v PostgrestVersion /tmp/generated.ts)

  e2e:
    name: End to end
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - name: Cache Supabase images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-image-cache
          key: supabase-images-v3-e2e-${{ hashFiles('supabase/config.toml') }}
      - run: scripts/ci/supabase-start.sh -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Point the build at the local stack
        run: |
          set -euo pipefail
          key=$(supabase status -o json | jq -r .PUBLISHABLE_KEY)
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
          service=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)
          echo "::add-mask::$service"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Local secret key for the test step only
        id: local-keys
        run: |
          set -euo pipefail
          secret=$(supabase status -o json | jq -r .SECRET_KEY)
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - run: pnpm e2e
        env:
          SUPABASE_SECRET_KEY: ${{ steps.local-keys.outputs.secret }}

  deploy-db:
    name: Deploy database
    needs: [verify, test-db, e2e]
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - run: supabase link --project-ref "$PROD_REF"
      - name: Show what will be applied
        run: supabase migration list --linked
      - run: supabase db push

  # deploy-functions: add back (between db and frontend) when supabase/functions
  # exists, for example the Hubtel MoMo webhooks.

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: deploy-db
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_c3xMCYVFW4OzMKzayGvmP1qO
      VERCEL_PROJECT_ID: prj_QHcxXMnP5UcABWQLryi8T0aS56co
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
      - name: Deploy
        id: deploy
        # One archive instead of thousands of files: the free plan allows 5,000
        # file uploads a day, which a dozen deploys used up on 27 Oct.
        run: vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
      - name: Verify production serves this commit
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            live=$(curl -fsS "$PROD_URL/api/version" | sed -E 's/.*"sha":"([^"]*)".*/\1/' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live is $live"; exit 0; fi
            echo "Live is '$live', waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "Production is not serving $GITHUB_SHA"; exit 1
      - name: Smoke test key pages
        run: |
          set -euo pipefail
          for path in / /roadmaps /start /login /signup /privacy /terms /manifest.webmanifest /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL$path")
            echo "$path $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/dashboard")
          [ "$code" = "307" ] || { echo "::error::/dashboard should redirect signed out visitors, got $code"; exit 1; }
      # Only when the new build actually went live and then failed its checks;
      # a failed build never touched production, so there is nothing to undo.
      - name: Roll back to the previous production deployment
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::warning::Deploy checks failed; rolling Vercel back to the previous production deployment."
          vercel rollback --yes --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || echo "::error::Automatic rollback failed. Roll back by hand in Vercel, Deployments."
