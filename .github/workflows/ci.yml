name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Public values only; placeholders are enough for a build check.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0 # keep in step with the local CLI; generated types depend on it
      # Local Supabase in Docker, trimmed to what migrations and tests need.
      - run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      # Every migration from scratch, then the database linter and pgTAP tests.
      - run: supabase db reset
      - run: supabase db lint --level error
      - run: supabase test db
      - name: Generated types match the migrations
        run: |
          set -euo pipefail
          # Pulls the postgres-meta image; public ECR sometimes rate limits
          # shared runners, so retry before calling it a failure.
          for attempt in 1 2 3; do
            supabase gen types typescript --local > /tmp/generated.ts && break
            [ "$attempt" = 3 ] && exit 1
            echo "gen types failed (attempt $attempt), retrying in 30s"; sleep 30
          done
          diff <(grep -v PostgrestVersion src/lib/supabase/database.types.ts) \
               <(grep -v PostgrestVersion /tmp/generated.ts) \
            || { echo "database.types.ts is stale. Regenerate it after changing migrations."; exit 1; }
