name: CI

# Runs on every PR into main and on pushes to main (the latter is a safety
# net for the rare direct push, e.g. an admin merge bypass — the real gate
# is the branch protection rule requiring these checks on pull_request).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Integration tests against the real Supabase project (see
      # test/helpers.js's header for why — RLS and session-bleed bugs only
      # exist at that boundary). NODE_ENV=test skips the auth/global/AI
      # rate limiters, which the suite's real register/login calls would
      # otherwise blow through.
      - run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          JWT_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:5173

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # No real backend needed to verify the build itself compiles cleanly —
      # this catches import errors, JSX typos, bad Tailwind classes the
      # Showcase build harness would flag, that kind of thing.
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3001
